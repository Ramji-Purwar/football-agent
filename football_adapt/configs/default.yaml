# ======================================================================
# default.yaml
# PLACEHOLDER VALUES. They exist only so the code runs. Every number here
# must be calibrated in Phase 0 (see opponent.md, Section 14) and then frozen.
# Override any value from code: load_config(overrides={"vision.radius": 15.0})
# ======================================================================

pitch:   {length: 100.0, width: 60.0, goal_width: 12.0}
time:    {T: 1200, T_half: 600}
speeds:  {player: 1.0, dribble: 0.75, pass: 3.0}   # dribble = speed of the player carrying the ball
vision:
  radius: 25.0                        # how far a player sees OPPONENTS. The playmaker uses infinity
  # The ball is seen by everyone, wherever it is, and so every defender who can get to the path of a pass in time may
  # intercept it. false = the ball is hidden outside the radius too, and only a defender who has the passer inside
  # his radius reacts to a pass.
  ball_always: true
actions:
  n_directions: 8
  # A learning team is offered PASS_k only when no defender the passer can SEE could get to the ball: not by the
  # interception rule with `slack` extra steps in hand, and not by standing within `lane` m of the cut-out radius of
  # the ball's path. It is the test the scripted team makes before it passes. enabled: false = every pass is offered.
  # call: the receiver calls, so the defenders HE sees count as well as the passer's own (as opponent.attack.call
  # for the scripted team). Off, three quarters of a trained team's interceptions came from defenders out of the
  # passer's sight.
  open_pass: {enabled: true, slack: 1.5, lane: 1.5, call: false}
  # Through balls for a learning team: THROUGH_k plays the ball into the space ahead of teammate k for him to run
  # onto (the scripted team's own rule: `lead` m ahead, toward goal once he is in their half, a spot he reaches
  # before the ball, no defender within `space` m of it or of him, not to a teammate more than `back_tol` m behind).
  # Offered when no defender the passer counts could get to it on the way (`cut_margin` m of slack).
  through: {enabled: true, lead: 8.0, space: 8.0, cut_margin: 0.5, back_tol: 2.0}
  # HOLD_SHAPE for a learning team sends the player to the spot a scripted player would hold: his home position, which
  # moves up, drops back and slides across with the ball as the scripted team's block does, and his supporting spot
  # while the team has the ball. Going for the ball stays the team's own choice. false = the bare formation anchor.
  shape_guide: true
  # A learning player is offered only the choices that belong to his situation. Off the ball: STAY, HOLD_SHAPE,
  # GO_TO_BALL, TACKLE and SHADOW, not the 8 bare directions (a new policy spreads its choices over them, and its
  # players wander). On the ball: the directions, STAY, PASS, DRIBBLE_GOAL and SHOOT. false = every valid action.
  context_mask: false

mechanics:
  tackle_dist: 2.0
  tackle_recover: 3
  max_steal_chain: 2                  # at most this many tackle steals in a row ...
  flight_cut: {radius: 1.5, free: 3.0}   # an opponent within radius of the ball's path takes the pass (not in its first `free` m). 0 = off
  # A missed shot restarts from the defending team's goal-kick spot. clear_box: the other team must be outside the
  # penalty box (depth x 2*half_width, on the goal line) when it is taken, and stays out until the ball is played or leaves it.
  goal_kick: {enabled: true, x: 6.0, protect: 10, clear_box: true, box: {depth: 16.5, half_width: 22.5}}
  clear: {dist: 40.0, spread: 0.2}    # clearance: a long ball upfield to nobody, at most dist m, aiming error spread (rad)
  steal_lock: 15                      # ... then no tackles for this many steps (or until the ball is passed/shot/picked up)
  pickup: 1.5
  intercept_margin: 0.5
  shadow_dist: 4.0
  shoot_max: 35.0
  p_max: 0.8
  d0: 30.0
  shot_block_scale: 4.0
  shot_miss_spread: 6.0
  sure_goal: {enabled: true, depth: 5.5, half_width: 11.5}   # a shot from inside the goal area (small box) always scores
  s_pass: 0.15

control:   {c_min: 0.5, l_ctrl: 20.0}
structure: {zeta: 2}                  # our structure level: 0, 1 or 2 (the opponent is always 2)

reward:
  # Everything in POINTS. The game hands the trainer points x `scale`; only the ratios between terms matter to the
  # learning. Train with --gamma 1 (the default) so that every choice is judged by the whole match. The result and the
  # goals go to the whole team. Every other term is "small": per player, all of them together stay within +-small_cap
  # over a match, so a win always counts for more than any sum of them. "Own" terms go to the player who earned
  # them (per_player), the others to every player.
  scale: 0.001
  eta: 1000.0                         # end of match: + for a win, - for a loss, 0 for a draw
  goal: 100.0                         # we score +, they score -
  small_cap: 50.0
  per_player: true                    # own terms to the player who earned them, and every player his own value and
                                      # advantage in the trainer (false: everything to the team)
  shaping_weight: 1.0                 # lambda_t on the small terms: the trainer can anneal it toward 0
  # how much a pass would help (free to receive, open lanes): the metres it gains toward goal / gain, or the rise in
  # the chance to score / chance, whichever is larger, 0..1. 0 for a pass back or sideways
  usefulness: {gain: 20.0, chance: 0.3}
  # passing
  w_pass_done: 0.5                    # own: a completed pass, any direction; only the first pass_count_cap of the match
  pass_count_cap: 30
  w_pass_accuracy: 5.0                # end of match: x how far the share of our passes completed is above accuracy_bar
  accuracy_bar: 0.9                   # (0 at the bar, all of it at 100%), in full from accuracy_min passes. Small: the
  accuracy_min: 10                    # pass test offers only safe passes, so every team completes ~95% of its passes
  w_receive: 0.5                      # own: receiving a completed pass that went receive_gain m or more forward
  receive_gain: 5.0
  w_free: 0.0                         # own: per step we have the ball and the carrier has an open pass to him, x how
  free_cap: 10.0                      # useful that pass would be; at most free_cap a match. Off: a team that kept the
                                      # ball deep earned the most of it; w_receive pays being free when it is used
  w_turnover: -2.0                    # own: he lost the ball (tackled, his pass cut out, his loose pass picked up)
  # attack
  w_progress: 0.05                    # per metre the ball moves toward their goal while we keep it (back = minus)
  progress_pass_cap: 20.0             # ... but one pass is paid for at most this many metres (0 = no cap)
  w_chance: 10.0                      # x the change of our carrier's chance to score (0..1) while we keep the ball
  w_shot: 5.0                         # own: x the shot's chance
  w_big_chance: 10.0                  # own: a shot at a chance of big_chance or better
  big_chance: 0.3
  w_poor_shot: -5.0                   # own: a shot that is not the best he can do (shot_rule)
  w_missed_shot: -5.0                 # own: the ball tackled off him within shot_rule.missed_steps of a moment he had
                                      # the shot on (a defender closing in, a chance of min_chance_pressed or more)
  # The best shot he can do: within `far` m of goal, a chance of min_chance_close or more. Further out, not when he
  # could carry the ball closer (nobody within `pressed` m of him, nobody within `ahead` m in front: the scripted team
  # carries on then); pressed, min_chance_pressed or more; blocked in front only, min_chance or more.
  shot_rule: {pressed: 6.0, ahead: 7.0, far: 14.0, min_chance: 0.3, min_chance_pressed: 0.15, min_chance_close: 0.15,
              missed_steps: 5}
  # defence
  w_chance_against: -10.0             # x the change of THEIR carrier's chance to score while they keep the ball (a
                                      # fall gives it back): the mirror of w_chance
  w_shot_against: -5.0                # x the chance of each shot they take
  w_tackle: 2.0                       # own: he tackled the ball off them
  w_interception: 3.0                 # own: he cut out their pass
  win_zone: 1.0                       # winning the ball pays x (1 + win_zone x how far up the pitch, 0..1)
  w_open_lanes: -0.2                  # own: per step they have the ball, per pass their carrier has open (none of ours
                                      # would get to it), x how dangerous it is (usefulness to them), to the player of
                                      # ours nearest that lane (not the one nearest the ball, who goes for it)
  # positions
  w_formation: 0.01                   # own (team mean without per_player): per step, how well he stands on his
  formation_dist: 15.0                # HOLD_SHAPE spot (needs actions.shape_guide): 1 on it, about a third at this many
                                      # metres. His support run while we have the ball, his place without it. The player
                                      # nearest the ball is not counted

# Anchors are fractions of the pitch in the TEAM frame:
# [x along the length (0 = own goal, 1 = opponent goal), y across the width].
# Slot order is always defenders, then midfielders, then forwards.
formations:
  ours: "2-2-1"
  opponent: "2-2-1"
  anchors:
    "2-2-1": [[0.25, 0.30], [0.25, 0.70], [0.50, 0.30], [0.50, 0.70], [0.75, 0.50]]
    "2-1-2": [[0.25, 0.30], [0.25, 0.70], [0.50, 0.50], [0.75, 0.30], [0.75, 0.70]]
    "1-3-1": [[0.25, 0.50], [0.50, 0.20], [0.50, 0.50], [0.50, 0.80], [0.75, 0.50]]
    "1-2-2": [[0.25, 0.50], [0.50, 0.30], [0.50, 0.70], [0.75, 0.30], [0.75, 0.70]]
    "3-1-1": [[0.25, 0.20], [0.25, 0.50], [0.25, 0.80], [0.50, 0.50], [0.75, 0.50]]
  # Every formation has an attacking and a defending shape. The anchors slide between them with possession:
  # each line (D/M/F) goes to its own depth x, and the width is scaled by y_scale around the centre line.
  # rate = phase change per step (0.05 = 20 steps from base to a full shape). enabled: false = static anchors.
  phases:
    enabled: true
    rate: 0.05
    attack: {x: {D: 0.42, M: 0.76, F: 0.85}, y_scale: 1.15}
    defend: {x: {D: 0.15, M: 0.30, F: 0.50}, y_scale: 0.80}

# Play style of each team: how it plays, on top of its formation. A preset is a partial copy of the config that is
# merged over it for that team only. It may set `opponent.*` (behaviour) and `formations.phases.*` (shape), nothing else.
styles:
  ours: normal                        # used for our shape, and for our behaviour when our team is scripted
  opponent: normal
  presets:
    normal: {}                        # exactly the values written in this file
    # High line and a press that cuts passing lanes: the nearest player goes to the ball, the others stand in the
    # middle between the carrier and the players he could pass to. Numbers forward, riskier passes.
    aggressive:
      formations:
        phases:
          attack: {x: {D: 0.50, M: 0.80, F: 0.88}, y_scale: 1.20}
          defend: {x: {D: 0.25, M: 0.42, F: 0.62}, y_scale: 0.90}
      opponent:
        zone:    {r_zone: 15.0, engage: 18.0, double_dist: 12.0}
        lanes:   {enabled: true}
        attack:  {w_fwd: 2.4, pass_min: 0.25, safe_slack: 1.2, lane_margin: 1.2}
        support: {adv: 8.0, def: 4.0}
        run:     {lead: 13.0, r_run: 22.0}
        moves:
          through: {space: 6.5}
    # Deep, narrow block that keeps players back even with the ball and drops quickly. It breaks with long balls
    # to the forward, and does not keep the ball for long: after a while it forces the play (patience).
    defensive:
      formations:
        phases:
          rate: 0.08
          attack: {x: {D: 0.25, M: 0.50, F: 0.78}, y_scale: 1.05}
          defend: {x: {D: 0.13, M: 0.26, F: 0.50}, y_scale: 0.70}
      opponent:
        roles:    {d_max_pass: 60.0}
        patience: {enabled: true}
        moves:
          counter: {steps: 25, lead_mult: 1.8, fwd_mult: 1.8}

opponent:
  zone:   {r_zone: 12.0, engage: 8.0, double_dist: 10.0, omega: 0.4, eps_arrive: 1.0, transition_max: 60}
  switching:
    mode: NONE                        # NONE | SCHEDULED | RANDOM | SCORE_REACTIVE
    dwell_min: 150
    scheduled:      {t_switch: 600, target: "1-2-2"}
    random:         {h_switch: 0.005}
    score_reactive: {check_interval: 50, trail_thresh: 1, lead_thresh: 1,
                     f_att: "1-2-2", f_def: "3-1-1"}
  attack:  {shoot_min: 0.3, w_fwd: 2.0, w_open: 0.5, w_dist: 0.3, pass_min: 0.3,
            d_danger: 6.0, hub_bonus: 0.3, open_max: 15.0, lane_margin: 1.5, safe_slack: 1.5, shoot_close: 14.0, shoot_free: 7.0, max_pass: 60.0, fwd_cap: 1.0,
            call: true}   # call: for a pass to a teammate, the defenders that teammate sees count as well as the passer's own
  support: {adv: 4.0, mid: 6.0, def: 1.0, r_support: 10.0,
            offer_dist: 10.0, offer_max: 30.0, offer_sep: 8.0, offer_space: 6.0}   # midfielders offer a back pass this far behind/beside the carrier
  block:   {push: 0.0, drop: 0.0, rate: 0.5}   # team-wide x shift: + when we have the ball, - when they do. 0/0 = off
  run:     {enabled: true, lead: 10.0, r_run: 18.0, dy: 8.0, goal_gap: 4.0}   # forward runs ahead of the ball
  width:   {attack: 0.0, defend: 0.0, rate: 0.01, slide: 3.0, slide_rate: 0.3}   # y stretch / compaction, ball-side slide
  cover:   {enabled: true, dist: 5.0, max_dev: 4.0}   # second defender sits goal-side of the presser
  roles:   {push_scale: {D: 0.6, M: 1.0, F: 1.0}, drop_scale: {D: 1.0, M: 1.0, F: 0.5},
            d_dribble_max_x: 0.6, carry_bias: {D: 0.8, M: 0.8, F: 0.0}, d_max_pass: 45.0, d_shoot_extra: 0.2, pass_bias: {D: -0.1, M: 0.0, F: 0.1}}
  moves:                               # football patterns. steps: 0 / enabled: false / dist: 0 turns one off
    through:       {enabled: true, lead: 8.0, space: 8.0, bonus: 0.1, cut_margin: 0.5}   # pass into space ahead of a runner
    pass_move:     {steps: 10, run: 12.0, one_two_bonus: 0.4}          # passer runs on; bonus for giving it back to him
    counter_press: {steps: 10, n: 2}                                    # after losing the ball, the n nearest chase it
    # their pass is in the air: the player nearest to where it is going closes the receiver down. The receiver is the
    # opponent seen within `lane` m of the ball's line; if none is seen, a point `lead` m ahead of the ball.
    close_down:    {enabled: true, lane: 6.0, lead: 15.0}
    counter:       {steps: 15, lead_mult: 1.6, fwd_mult: 1.5}          # after winning it, run further and pass forward early
    assist:        {enabled: true}                                      # give it to a teammate with a clearly better shot
    box:           {x: 0.7, wide: 8.0, post_gap: 8.0, cutback_gap: 18.0}   # ball wide in the final third: far-post run + cut-back spot
    overlap:       {trigger: 12.0, ahead: 8.0, wide: 7.0, max_dev: 18.0}   # wide midfielder runs round the outside of the carrier
    drop_deep:     {trigger: 35.0, dist: 12.0}                          # forward comes short when the ball is far behind him
  # Patience: after `start` steps of unbroken team possession the urgency rises, reaching 1 at `full` steps. It lowers
  # the shot bar (by shoot) and the forward-pass bar (by pass_relief); at 1 the carrier stops passing back and runs at goal.
  patience: {enabled: false, start: 60, full: 120, shoot: 0.1, pass_relief: 0.2}
  # Cutting passing lanes (off = pure zonal defence). While the other team has the ball, players who are not pressing
  # stand on the line from the ball to a receiver the carrier could pass to, at `frac` of the way to him (0.5 = in the
  # middle of the two). Only receivers level with or ahead of the ball count (up to `side` m behind it). A player goes
  # at most `max_dev` m (by role) from his home position, and each lane gets one player.
  lanes:   {enabled: false, frac: 0.5, side: 8.0, max_dev: {D: 12.0, M: 22.0, F: 22.0}}
  # Clearance: a defender who is pressed in his own part of the pitch (x <= max_x of the length) and has no teammate
  # he knows to be free kicks the ball long upfield. w_mate pulls the aim toward a teammate who is ahead of the ball.
  clear:   {enabled: true, max_x: 0.5, w_mate: 0.5}
  space:   {radius: 6.0, w_mates: 0.5, w_move: 0.2}   # off-ball attackers drift up to radius m toward free space (0 = off)
  carrier: {press_dist: 3.0, press_relief: 0.2, better_margin: 0.1,
            back_tol: 2.0, free_dist: 8.0, carry_free: 10.0, carry_step: 4.0,
            release_dist: 6.0, release_shoot: 0.0}   # defender within release_dist: shoot (bar lowered) or pass to a free man now   # back passes only under pressure (defender within press_dist): to a teammate with no
                                                  # visible defender within free_dist (and inside my own vision)
  # Hunt: zonal defence leaves a ball alone that stays outside every zone, so the other team could sit on it deep in
  # its own half for the rest of the match. The steps of one possession of theirs in which none of us is pressing the
  # ball are counted; past `after` the `n` nearest players leave their zones and go for it, until we have the ball
  # again. If nobody sees the ball they go and look for it near the goal we attack: `depth` m out from the goal line,
  # `wide` m either side of its centre. after: 0 = off (pure zonal defence).
  hunt:    {after: 80, n: 2, depth: 10.0, wide: 15.0}
  randomness: {eps_opp: 0.0}          # default off
  playmaker: {sigma: 0}               # 0 = none, otherwise the opponent player number 1..5
