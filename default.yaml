# ======================================================================
# default.yaml
# PLACEHOLDER VALUES. They exist only so the code runs. Every number here
# must be calibrated in Phase 0 (see opponent.md, Section 13) and then frozen.
# Override any value from code: load_config(overrides={"vision.radius": 15.0})
# ======================================================================

pitch:   {length: 100.0, width: 60.0, goal_width: 12.0}
time:    {T: 1200, T_half: 600}
speeds:  {player: 1.0, dribble: 0.9, pass: 3.0}
vision:  {radius: 25.0}               # normal players. The playmaker uses infinity
actions: {n_directions: 8}

mechanics:
  tackle_dist: 2.0
  tackle_recover: 3
  pickup: 1.5
  intercept_margin: 0.5
  shadow_dist: 4.0
  shoot_max: 25.0
  p_max: 0.6
  d0: 15.0
  shot_block_scale: 4.0
  shot_miss_spread: 6.0
  s_pass: 0.15

control:   {c_min: 0.5, l_ctrl: 20.0}
structure: {zeta: 2}                  # our structure level: 0, 1 or 2 (the opponent is always 2)

reward:
  eta: 1.0
  w_pass: 0.02
  w_tackle: 0.02
  w_shot: 0.02
  w_turnover: -0.02
  shape_cap: 5.0                      # cap on total |shaping| per episode
  shaping_weight: 1.0                 # lambda_t: the trainer anneals this toward 0

# Anchors are fractions of the pitch in the TEAM frame:
# [x along the length (0 = own goal, 1 = opponent goal), y across the width].
# Slot order is always defenders, then midfielders, then forwards.
formations:
  ours: "2-2-1"
  opponent: "2-2-1"
  anchors:
    "2-2-1": [[0.25, 0.30], [0.25, 0.70], [0.50, 0.30], [0.50, 0.70], [0.75, 0.50]]
    "2-1-2": [[0.25, 0.30], [0.25, 0.70], [0.50, 0.50], [0.75, 0.30], [0.75, 0.70]]
    "1-3-1": [[0.25, 0.50], [0.50, 0.20], [0.50, 0.50], [0.50, 0.80], [0.75, 0.50]]
    "1-2-2": [[0.25, 0.50], [0.50, 0.30], [0.50, 0.70], [0.75, 0.30], [0.75, 0.70]]
    "3-1-1": [[0.25, 0.20], [0.25, 0.50], [0.25, 0.80], [0.50, 0.50], [0.75, 0.50]]

opponent:
  zone:   {r_zone: 12.0, omega: 0.4, eps_arrive: 1.0, transition_max: 60}
  switching:
    mode: NONE                        # NONE | SCHEDULED | RANDOM | SCORE_REACTIVE
    dwell_min: 150
    scheduled:      {t_switch: 600, target: "1-2-2"}
    random:         {h_switch: 0.005}
    score_reactive: {check_interval: 50, trail_thresh: 1, lead_thresh: 1,
                     f_att: "1-2-2", f_def: "3-1-1"}
  attack:  {shoot_min: 0.15, w_fwd: 2.0, w_open: 0.5, w_dist: 0.3, pass_min: 0.3,
            d_danger: 6.0, hub_bonus: 0.3, open_max: 15.0}
  support: {adv: 8.0, mid: 6.0, def: 3.0, r_support: 10.0}
  randomness: {eps_opp: 0.0}          # default off
  playmaker: {sigma: 0}               # 0 = none, otherwise the opponent player number 1..5
